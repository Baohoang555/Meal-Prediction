[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meal-history-pipeline"
version = "1.0.0"
description = "Normalize and validate meal history CSV exports."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pandas>=2.2,<4",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]
forecast-gru = [
    "torch>=2.2,<3",
]

[project.scripts]
meal-history = "meal_history.pipeline:main"
meal-history-api = "meal_history.web:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meal_history = ["static/*"]