name: CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  smoke-test-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest

      - name: Generate synthetic test dataset
        run: |
          mkdir -p data
          python -c "
          import pandas as pd
          import numpy as np

          dates = pd.date_range(start='2025-01-01', periods=100, freq='D')
          df = pd.DataFrame({
              'Ngày': dates.strftime('%Y-%m-%d'),
              'Trạng thái': np.random.choice([0, 1], size=100)
          })
          df.to_csv('data/mock_input.csv', index=False)
          print('Successfully generated data/mock_input.csv with 100% valid dates and 2 statuses.')
          "

      - name: Run pipeline verification with validation rules
        run: |
          python -c "
          from meal_history.pipeline import run_pipeline
          run_pipeline('data/mock_input.csv', 'data/mock_output.csv')
          print('Pipeline ran and passed validation successfully.')
          "

  build-and-push:
    needs: smoke-test-pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Server via SSH
        # Chỉ chạy nếu đã thiết lập các Secrets cho server
        if: ${{ env.SERVER_HOST != '' }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "Deploying container image to production server..."
          # Sử dụng ssh-action hoặc lệnh SSH cơ bản:
          # ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "
          #   cd /opt/meal-prediction &&
          #   docker compose pull &&
          #   docker compose up -d --remove-orphans
          # "