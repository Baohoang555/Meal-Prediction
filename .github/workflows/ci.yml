name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies and test tools
        run: |
          python -m pip install --upgrade pip
          # Cài đặt gói cùng nhóm dependencies [test] (fastapi, pandas, uvicorn, httpx, pytest)
          pip install ".[test]"

      - name: Run test suite
        run: |
          pytest -v --tb=short